name: checks

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  MNEMONIC: "exchange vintage ocean narrow danger return culture ignore trim solve clock hidden buddy wise emotion"

permissions:
  contents: read

jobs:
  lint:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up environment
        uses: ./.github/actions/setup
      - run: npm run lint
      - name: Check for unused imports
        run: forge build && forge lint --deny notes --only-lint unused-import

  tests:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up environment
        uses: ./.github/actions/setup
      - run: npm run test
      - name: Check procedurally generated contracts are up-to-date
        run: npm run test:generation
      - name: Check pragma validity
        run: npm run test:pragma -- --concurrency 1

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Run coverage
        run: npm run coverage
      - uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up environment
        uses: ./.github/actions/setup
      - uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run CodeSpell
        uses: codespell-project/actions-codespell@v2
        with:
          check_filenames: true
          skip: "package-lock.json,*.pdf"
